name: Collect regional data

on:
  workflow_dispatch:
  schedule:
    # 08:40 China Standard Time on the 23rd of every month (00:40 UTC)
    - cron: "40 0 23 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect-regional.yml"
      - "family_economic_dashboard/collect_regional_nbs.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect NBS provincial monthly data
        run: python -m family_economic_dashboard.collect_regional_nbs
      - name: Show collection summary
        run: |
          cat data/regional_provenance.json
          echo "--- latest rows ---"
          tail -n 30 data/regional_observations.csv
      - name: Commit regional data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regional_observations.csv data/regional_provenance.json
          if git diff --cached --quiet; then
            echo "No regional data changes"
          else
            git commit -m "data: update regional NBS observations"
            git push
          fi
      - name: Upload regional data artifact
        uses: actions/upload-artifact@v4
        with:
          name: regional-economic-data
          path: |
            data/regional_observations.csv
            data/regional_provenance.json
          retention-days: 90
