name: Collect recruitment market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "family_economic_dashboard/collect_recruitment.py"
      - "family_economic_dashboard/recruitment.py"
      - "data/recruitment_searches.csv"
      - ".github/workflows/collect-recruitment.yml"
  schedule:
    # 09:10 China Standard Time on the 12th of every month (01:10 UTC)
    - cron: "10 1 12 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: recruitment-dashboard
  cancel-in-progress: false

jobs:
  # Recruitment-specific changes are ignored by build.yml, so this job is the
  # single writer for recruitment data, generated dist files, and Pages deploys.
  collect-build-deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official recruitment salary data
        run: python -m family_economic_dashboard.collect_recruitment
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build dashboard
        run: python -m family_economic_dashboard.cli --output dist
      - name: Commit recruitment data and dashboard
        run: |
          if [ -z "$(git status --porcelain -- data/recruitment_market.csv data/recruitment_provenance.json dist/)" ]; then
            echo "No recruitment/dashboard changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/recruitment_market.csv data/recruitment_provenance.json dist/
            git commit -m "Update recruitment dashboard"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
