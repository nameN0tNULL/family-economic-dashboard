name: Collect recruitment market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "family_economic_dashboard/collect_recruitment.py"
      - ".github/workflows/collect-recruitment.yml"
  schedule:
    # 09:10 China Standard Time on the 12th of every month (01:10 UTC)
    - cron: "10 1 12 * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official recruitment salary data
        run: python -m family_economic_dashboard.collect_recruitment
      - name: Commit recruitment data
        run: |
          if git diff --quiet -- data/recruitment_market.csv data/recruitment_provenance.json; then
            echo "No recruitment data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recruitment_market.csv data/recruitment_provenance.json
          git commit -m "Update recruitment market data"
          git push
