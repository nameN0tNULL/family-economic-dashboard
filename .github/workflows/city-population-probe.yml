name: Probe NBS city population

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "family_economic_dashboard/probe_city_population_nbs.py"
      - ".github/workflows/city-population-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe main-city population data
        run: python -m family_economic_dashboard.probe_city_population_nbs
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/city_population_nbs_probe.json
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "Probe NBS city population data"
            git pull --rebase origin main
            git push
          fi
