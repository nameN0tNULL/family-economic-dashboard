name: Collect housing market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "family_economic_dashboard/collect_housing.py"
      - "family_economic_dashboard/housing.py"
      - "tests/test_housing.py"
      - "config/indicators.json"
      - ".github/workflows/collect-housing.yml"
  schedule:
    # 09:20 China Standard Time on the 16th of every month (01:20 UTC),
    # after the usual NBS 70-city and national housing releases around the 15th.
    - cron: "20 1 16 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-writer
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official housing data
        run: python -m family_economic_dashboard.collect_housing
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build dashboard
        run: python -m family_economic_dashboard.cli --output dist
      - name: Commit housing data and dashboard
        run: |
          if [ -z "$(git status --porcelain -- data/housing_city_prices.csv data/housing_observations.csv data/housing_provenance.json dist/)" ]; then
            echo "No housing/dashboard changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/housing_city_prices.csv data/housing_observations.csv data/housing_provenance.json dist/
            git commit -m "Update housing dashboard"
            git pull --rebase origin main
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
